# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - STP-App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'

      - name: Install and test backend
        run: |
          npm install
          npm run build --if-present
          npm run test --if-present
        working-directory: ./backend
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/smart-travel-planner-test
          JWT_SECRET: ci_test_jwt_secret

      - name: Build frontend
        run: |
          npm install
          npm run build
        working-directory: ./frontend
        env:
          VITE_API_URL: /

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: .
          exclude: |
            .git
            frontend/node_modules
            backend/node_modules

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout
      administration: write #This is required to configure the OIDC subject claim format

    steps:
      - name: Configure OIDC subject claim format
        uses: actions/github-script@v7
        with:
          script: |
            await github.request('PUT /repos/{owner}/{repo}/actions/oidc/customization/sub', {
              owner: context.repo.owner,
              repo: context.repo.repo,
              use_default: false,
              include_claim_keys: ['repo', 'ref']
            });

      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_FD46480F1206488784DC3F349C368054 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_15F67F71EAFA4AAC84A77161184BD0B3 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_FE5D69995EF14BD781A11143CBBD40AB }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'STP-App'
          slot-name: 'Production'
          package: .
          startup-command: node backend/server.js
          